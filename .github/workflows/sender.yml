name: Teste de Entregabilidade SMTP com Logs Detalhados

on:
  workflow_dispatch:

jobs:
  test_sending:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar Dependências do Sistema (Postfix, Mailutils, WireGuard)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postfix mailutils wireguard-tools
          
          # Configura Postfix como Direct/Internet Site
          sudo postconf -e "myhostname = sub.veriscope.dedyn.io"
          sudo postconf -e "mydomain = veriscope.dedyn.io"
          sudo postconf -e "myorigin = sub.veriscope.dedyn.io"
          sudo postconf -e "inet_interfaces = all"
          
          sudo service postfix restart

      - name: Instalar Dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install requests dkimpy cryptography dnspython

      - name: Executar Script Python de Envio
        env:
          ROUTE64_API_KEY: ${{ secrets.ROUTE64_API_KEY }}
        run: |
          python teste_envio.py

      - name: Aguardar Processamento do Postfix na Rede
        run: |
          echo "⏳ Aguardando 15 segundos para o Postfix tentar entregar no Gmail..."
          sleep 15

      - name: 🔍 ANALISAR FILA DE E-MAILS (MAILQ)
        if: always()
        run: |
          echo "=========================================="
          echo "       ESTADO DA FILA DO POSTFIX          "
          echo "=========================================="
          sudo mailq

      - name: 📄 EXTRAIR LOGS REAIS DO SERVIDOR DE E-MAIL
        if: always()
        run: |
          echo "=========================================="
          echo "    LOGS DETALHADOS DE SAÍDA (/var/log)   "
          echo "=========================================="
          if [ -f /var/log/mail.log ]; then
            sudo cat /var/log/mail.log | grep -E "status=|error|connect|relay" || sudo cat /var/log/mail.log
          else
            sudo journalctl -u postfix --no-pager -n 100
          fi
