name: Teste de Entregabilidade SMTP via Route64 WireGuard

on:
  workflow_dispatch:

jobs:
  test_sending:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar Dependências do Sistema
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postfix mailutils wireguard-tools resolvconf

      - name: Configurar e Subir Túnel WireGuard (Route64)
        env:
          WG_KEY: ${{ secrets.ROUTE64_WG_PRIVATE_KEY }}
          WG_IP: ${{ secrets.ROUTE64_IPV6 }}
          WG_END: ${{ secrets.ROUTE64_ENDPOINT }}
        run: |
          sudo -E python3 -c "
          import os, sys

          raw_key = os.environ.get('WG_KEY', '').strip()
          
          # Caso a secret venha vazia, usa o fallback do painel
          if not raw_key:
              raw_key = 'EGCw9w3aHzxnMw4rcK8k4ayCefIVKLzXpN3ag+Lh3O='

          # Corrige caracteres alterados pelo teclado do telemóvel
          key = raw_key.replace(' ', '+').replace('-', '+').strip()
          
          # Se tiver 43 caracteres, adiciona o '=' final
          if len(key) == 43 and not key.endswith('='):
              key += '='

          ip = os.environ.get('WG_IP', '2a11:6c7:f10:5::2/64').strip()
          endpoint = os.environ.get('WG_END', '148.59.165.6:20011').strip()

          print(f'-> Tamanho final da Chave Tratada: {len(key)} caracteres')

          if len(key) != 44:
              print(f'❌ ERRO CRÍTICO: Chave inválida ({len(key)} caracteres).')
              sys.exit(1)

          conf = f'''[Interface]
          PrivateKey = {key}
          Address = {ip}

          [Peer]
          PublicKey = dVQRQ7jk/5yGB6/d0HJdh+YYfICj3wUz6EQqhXnOz1A=
          AllowedIPs = ::/0
          Endpoint = {endpoint}
          PersistentKeepalive = 15
          '''

          os.makedirs('/etc/wireguard', exist_ok=True)
          with open('/etc/wireguard/wg0.conf', 'w') as f:
              f.write(conf)
          "
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
          echo "=== INTERFACE WIREGUARD ATIVA ==="
          sudo wg show

      - name: Configurar Postfix para IPv6 Route64
        run: |
          IPV6_RAW="${{ secrets.ROUTE64_IPV6 }}"
          [ -z "$IPV6_RAW" ] && IPV6_RAW="2a11:6c7:f10:5::2/64"
          IPV6_ADDR=$(echo "$IPV6_RAW" | cut -d'/' -f1)
          
          sudo postconf -e "myhostname = sub.veriscope.dedyn.io"
          sudo postconf -e "mydomain = veriscope.dedyn.io"
          sudo postconf -e "myorigin = sub.veriscope.dedyn.io"
          sudo postconf -e "inet_interfaces = all"
          sudo postconf -e "inet_protocols = ipv6"
          sudo postconf -e "smtp_bind_address6 = $IPV6_ADDR"
          
          sudo service postfix restart

      - name: Instalar Libs Python
        run: |
          python -m pip install --upgrade pip
          pip install requests dkimpy cryptography dnspython pillow

      - name: Executar Disparo com Python
        env:
          ROUTE64_API_KEY: ${{ secrets.ROUTE64_API_KEY }}
          ROUTE64_IPV6: ${{ secrets.ROUTE64_IPV6 }}
        run: |
          python teste_envio.py

      - name: Aguardar Processamento Fila
        run: sleep 10

      - name: LOGS REAIS DE ENTREGA SMTP
        if: always()
        run: |
          echo "=========================================="
          echo "       ESTADO DA FILA DO POSTFIX          "
          echo "=========================================="
          sudo mailq
          echo "=========================================="
          echo "         LOGS DO SERVIDOR SMTP            "
          echo "=========================================="
          sudo cat /var/log/mail.log || sudo journalctl -u postfix --no-pager -n 80
