name: Teste de Entregabilidade SMTP

on:
  workflow_dispatch:

jobs:
  test_sending:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar Dependências do Sistema (Postfix/MTA)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postfix wireguard-tools
          sudo service postfix start

      - name: Instalar Dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install requests dkimpy cryptography dnspython

      - name: Executar Teste de Envio SMTP
        env:
          ROUTE64_API_KEY: ${{ secrets.ROUTE64_API_KEY }}
        run: |
          python teste_envio.py
