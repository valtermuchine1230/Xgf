name: Veriscope Email Sender

on:
  schedule:
    - cron: '0 0 * * 1-5'  # Segunda a Sexta às 00:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo de execução'
        required: true
        default: 'all'
        type: choice
        options:
          - all          # Provisiona DNS + envia 5 emails de teste
          - provision    # Apenas configura DNS (SPF, DKIM, DMARC)
          - send-test    # Apenas envia os 5 emails (DNS já configurado)

# ===========================================================================
# CONCURRENCY — garante que apenas um runner por vez processa o mesmo estado
# ===========================================================================

concurrency:
  group: veriscope-sender-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # =========================================================================
  # JOB 1: PROVISIONAMENTO DNS (opcional, executado quando mode = provision ou all)
  # =========================================================================
  provision:
    name: Provisionar DNS (SPF, DKIM, DMARC)
    runs-on: ubuntu-latest
    if: github.event.inputs.mode == 'provision' || github.event.inputs.mode == 'all'
    timeout-minutes: 10
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install --no-cache-dir -r requirements.txt

      - name: Executar provisionamento DNS
        env:
          DESEC_TOKEN_1: ${{ secrets.DESEC_TOKEN_1 }}
        run: |
          python veriscope.py --provision

  # =========================================================================
  # JOB 2: ENVIO DE EMAILS DE TESTE (executado quando mode = send-test ou all)
  # =========================================================================
  send-test:
    name: Enviar 5 emails de teste
    runs-on: ubuntu-latest
    needs: [provision]
    if: github.event.inputs.mode == 'send-test' || github.event.inputs.mode == 'all'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # Apenas 1 runner para teste (evita duplicação)
      matrix:
        runner: [1]

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install --no-cache-dir -r requirements.txt

      - name: Setup KumoMTA (Docker)
        run: |
          # Criar configuração mínima do KumoMTA
          mkdir -p ./kumomta-config
          cat > ./kumomta-config/init.lua << 'EOF'
          local kumo = require 'kumo'
          kumo.on('init', function()
            kumo.start_esmtp_listener {
              listen = '0.0.0.0:2525',
              relay_hosts = { '0.0.0.0/0' },
            }
            kumo.define_spool { name = 'data', path = '/tmp/kumo-data' }
            kumo.define_spool { name = 'meta', path = '/tmp/kumo-meta' }
          end)
          kumo.on('smtp_server_message_received', function(msg)
            msg:set_meta('queue', 'null')
          end)
          EOF

          # Usar a imagem oficial do GHCR
          docker pull ghcr.io/kumocorp/kumomta:latest
          docker run -d --name kumomta -p 2525:2525 \
            -v $(pwd)/kumomta-config:/opt/kumomta/etc/policy \
            ghcr.io/kumocorp/kumomta:latest
          sleep 5
          netstat -tulpn | grep 2525 || true

      - name: Executar envio de teste
        env:
          DESEC_TOKEN_1: ${{ secrets.DESEC_TOKEN_1 }}
          KUMOMTA_HOST: "127.0.0.1"
          KUMOMTA_PORT: "2525"
          # Se não usares KumoMTA, podes definir o teu próprio SMTP:
          # KUMOMTA_HOST: "smtp.teuservidor.com"
          # KUMOMTA_PORT: "587"
        run: |
          python veriscope.py --send-test

      - name: Upload de logs (sempre)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-test
          path: |
            ./data/veriscope.log
            ./data/send_state.json
            ./data/sender_accounts.json
          retention-days: 7

      - name: Limpar container KumoMTA
        if: always()
        run: |
          docker stop kumomta || true
          docker rm kumomta || true

  # =========================================================================
