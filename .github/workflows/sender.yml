name: 🧪 Teste de Provisão & Envio

on:
  workflow_dispatch:
    inputs:
      skip_provision:
        description: 'Skip provisioning (use existing account)?'
        required: false
        default: 'false'

jobs:
  test-provision-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install \
            huggingface-hub \
            cryptography \
            dkim \
            requests \
            python-dotenv
      
      - name: 🔑 Provisionar conta única (sub0.veriscope0.dedyn.io)
        if: github.event.inputs.skip_provision != 'true'
        env:
          DESEC_DOMAIN: ${{ secrets.DESEC_DOMAIN }}
          DESEC_TOKEN_1: ${{ secrets.DESEC_TOKEN_1 }}
          ROUTE64_API_KEY: ${{ secrets.ROUTE64_API_KEY }}
          ROUTE64_API_URL: ${{ secrets.ROUTE64_API_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ secrets.HF_REPO }}
          KUMOMTA_HOST: ${{ secrets.KUMOMTA_HOST }}
          KUMOMTA_PORT: ${{ secrets.KUMOMTA_PORT }}
        run: |
          python provision_single_account.py
        continue-on-error: true
      
      - name: ⏳ Aguardando propagação DNS (30 segundos)
        run: sleep 30
      
      - name: 🔍 Validar registos DNS
        run: |
          echo "Verificando SPF para sub0.veriscope0.dedyn.io..."
          nslookup -type=TXT sub0.veriscope0.dedyn.io || echo "⚠ DNS ainda não propagado, continuando..."
          
          echo "Verificando DKIM para s2026.sub0.veriscope0.dedyn.io..."
          nslookup -type=TXT s2026.sub0.veriscope0.dedyn.io || echo "⚠ DNS ainda não propagado, continuando..."
          
          echo "Verificando DMARC para _dmarc.sub0.veriscope0.dedyn.io..."
          nslookup -type=TXT _dmarc.sub0.veriscope0.dedyn.io || echo "⚠ DNS ainda não propagado, continuando..."
        continue-on-error: true
      
      - name: 📧 Enviar emails de teste
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ secrets.HF_REPO }}
          KUMOMTA_HOST: ${{ secrets.KUMOMTA_HOST }}
          KUMOMTA_PORT: ${{ secrets.KUMOMTA_PORT }}
        run: |
          python send_test.py
      
      - name: 📊 Gerar relatório
        run: |
          echo "✓ Teste concluído!"
          echo ""
          echo "📌 PRÓXIMOS PASSOS:"
          echo "1. Verifique os emails de teste:"
          echo "   - macuacuavalter71@gmail.com"
          echo "   - Info1yenom@gmail.com"
          echo ""
          echo "2. Valide:"
          echo "   ✓ Chegaram à caixa de entrada"
          echo "   ✓ SPF/DKIM/DMARC passaram"
          echo "   ✓ Links funcionam"
          echo "   ✓ Imagens carregaram"
          echo ""
          echo "3. Se OK, execute a campanha real:"
          echo "   $ python enviador_smtp.py (para 30M leads)"
      
      - name: 📤 Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            *.log
            provision_single_account.log
            send_test.log
        continue-on-error: true
